<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="640" height="640" style="background: #0f172a;">
    <defs>
        <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>

        <linearGradient id="accent-grad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>

        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0.75" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <rect x="0" y="0" width="16" height="16" fill="url(#bg-glow)"/>

    <path d="M1 4 H15 M1 12 H15 M4 1 V15 M12 1 V15" stroke="#334155" stroke-width="0.25" stroke-dasharray="0.5 0.5" fill="none"/>

    <g filter="url(#drop-shadow)">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="url(#cyber-grad)" stroke-width="0.75" stroke-opacity="0.4"/>
        
        <path d="M8 1.5 L13.5 3.5 V7.5 C13.5 11 10.5 13.75 8 14.5 C5.5 13.75 2.5 11 2.5 7.5 V3.5 Z" 
              fill="#1e293b" stroke="url(#cyber-grad)" stroke-width="1" stroke-linejoin="round"/>
    </g>

    <g filter="url(#drop-shadow)">
        <path d="M8 3.25 L12 4.75 V7.5 C12 10 10 12.25 8 13 C6 12.25 4 10 4 7.5 V4.75 Z" 
              fill="none" stroke="url(#accent-grad)" stroke-width="0.5" stroke-linejoin="round" opacity="0.8"/>

        <circle cx="8" cy="6.5" r="1.75" fill="none" stroke="url(#cyber-grad)" stroke-width="1"/>
        <circle cx="8" cy="6.5" r="0.5" fill="#38bdf8"/>

        <path d="M7.25 8 L6.5 10.5 H9.5 L8.75 8" fill="url(#cyber-grad)"/>
        <path d="M8 8 V11" stroke="#38bdf8" stroke-width="0.5" stroke-linecap="round"/>
    </g>

    <circle cx="8" cy="11" r="0.4" fill="#a855f7"/>
    <circle cx="3.5" cy="4" r="0.3" fill="#06b6d4"/>
    <circle cx="12.5" cy="4" r="0.3" fill="#06b6d4"/>
</svg>
